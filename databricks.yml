# Databricks Asset Bundle configuration for the Ceres pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: ceres-pipeline

variables:
  catalog:
    description: Unity Catalog name (use `workspace` on Free Edition if a new catalog is denied)
    default: main
  schema:
    description: Schema (database) name
    default: ceres

resources:
  pipelines:
    ceres_medallion:
      name: "Ceres Medallion Transforms"
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      channel: CURRENT
      configuration:
        bronze_table: "${var.catalog}.${var.schema}.bronze_ceres_metadata"
        min_valid_year: "2000"
        top_topics_limit: "200"
      libraries:
        - file:
            path: ./pipeline/ceres_medallion.sql

  jobs:
    ceres_pipeline:
      name: "Ceres Open Data Pipeline"
      description: "Medallion Architecture: HuggingFace → Bronze (task) → Silver/Gold (Lakeflow pipeline) + Semantic Search"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # Daily at 06:00 UTC
        timezone_id: "UTC"
        pause_status: PAUSED
      tags:
        project: ceres
        pipeline: medallion
      tasks:
        - task_key: ingest_bronze
          description: "Ingest Ceres dataset from Hugging Face into the Bronze layer"
          notebook_task:
            notebook_path: ./01_ingest_huggingface_to_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: transform_medallion
          depends_on:
            - task_key: ingest_bronze
          description: "Declaratively build Silver + Gold materialized views from Bronze"
          pipeline_task:
            pipeline_id: ${resources.pipelines.ceres_medallion.id}

        - task_key: semantic_search
          depends_on:
            - task_key: transform_medallion
          description: "Build ML feature store and semantic search engine"
          notebook_task:
            notebook_path: ./04_semantic_search_engine.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Shared/ceres-pipeline
    run_as:
      service_principal_name: ${var.service_principal_name}
    variables:
      service_principal_name:
        description: Service principal for production runs
